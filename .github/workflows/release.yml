name: Publish release
on:
  push:
    branches: [main]
    paths: ['releases/v0.2.0.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      - run: npm test
      - name: Build launcher and packages
        shell: pwsh
        run: |
          dotnet publish client-native/MetalRageLauncher.csproj -c Release -o build/launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build/player/TLS | Out-Null
          Copy-Item 'build/launcher/Play Metal Rage Online.exe' build/player/
          Copy-Item releases/client/TLS/* build/player/TLS/
          Copy-Item client-native/README.ko.md build/player/README.ko.md
          Compress-Archive -Path build/player/* -DestinationPath MetalRage-Launcher-v0.2.0-win-x64.zip
          git archive --format=zip --output=MetalRage-Server-v0.2.0.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash MetalRage-*.zip -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content SHA256SUMS.txt
      - name: Publish v0.2.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.0 MetalRage-Server-v0.2.0.zip MetalRage-Launcher-v0.2.0-win-x64.zip SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Metal Rage Online v0.2.0' --notes-file releases/v0.2.0.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
